name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main"]

env:
  # Placeholder values only — no code path during lint/typecheck/test/build
  # ever makes a real network or database call, everything external is mocked.
  DATABASE_URL: "postgresql://user:password@localhost:5432/db"
  DIRECT_URL: "postgresql://user:password@localhost:5432/db"
  ADMIN_JWT_SECRET: "ci-placeholder-secret-not-used-in-production"
  GEMINI_API_KEY: "ci-placeholder-key"
  NEXT_PUBLIC_SITE_URL: "https://udesignai.com"
  NEXT_PUBLIC_WHATSAPP_NUMBER: "15550123456"

jobs:
  verify:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit & integration tests
        run: npm run test

      - name: Build
        run: npm run build
